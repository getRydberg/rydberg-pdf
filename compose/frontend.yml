services:
  frontend-pdf:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rydberg-frontend-pdf
    restart: unless-stopped
    profiles:
      - pdf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf-fe.rule=Host(`${PDF_HOST:-pdf.rydberg.app}`)"
      - "traefik.http.routers.pdf-fe.entrypoints=web"
      - "traefik.http.services.pdf-fe.loadbalancer.server.port=5173"
    networks:
      - rydberg-net

networks:
  rydberg-net:
    external: true
